<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music Decks</title>
  <style>
    :root { --bg:#0d0f14; --text:#e9ebf1; --muted:#b4bac8; --accent:#f2b84b; --card:rgba(255,255,255,.045); --border:rgba(255,255,255,.09); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #0d0f14; color: var(--text); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(ellipse at 85% 0%, rgba(242,184,75,.13) 0%, transparent 55%), #0d0f14;
    }
    .wrap { max-width: 40rem; margin: 0 auto; padding: 4.5rem 1.5rem 5rem; }
    .kicker { font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: .85rem; }
    h1 { font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin-bottom: 2rem; }
    ul { list-style: none; display: grid; gap: 1rem; }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.3rem 1.4rem;
      color: inherit;
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -.01em;
      transition: border-color .2s ease, transform .2s ease, background .2s ease;
    }
    a.card:hover { border-color: var(--accent); background: rgba(242,184,75,.08); transform: translateY(-1px); color: var(--accent); }

    .refresh-btn {
      position: fixed;
      top: max(0.65rem, env(safe-area-inset-top, 0px));
      right: max(0.65rem, env(safe-area-inset-right, 0px));
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0.4rem 0.75rem;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(13, 15, 20, 0.88);
      color: var(--accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .refresh-btn:hover,
    .refresh-btn:focus-visible {
      border-color: var(--accent);
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .refresh-btn:active { transform: scale(0.98); }
    @media (max-width: 40rem) {
      h1 { padding-right: 7rem; }
    }
  </style>
</head>
<body>
  <button type="button" class="refresh-btn" id="page-refresh" aria-label="Refresh page">↻ Refresh</button>
  <div class="wrap">
    <p class="kicker">Slide decks</p>
    <h1>Music Decks</h1>
    <ul>
      <li><a class="card" href="music-theory/">Music Theory</a></li>
      <li><a class="card" href="atonality/">Atonality and Beyond</a></li>
      <li><a class="card" href="music-history/">Western Music History Lineages</a></li>
    </ul>
  </div>
  <script>
    (function () {
      var btn = document.getElementById("page-refresh");
      if (!btn) return;
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var url = new URL(window.location.href);
        url.searchParams.set("r", String(Date.now()));
        window.location.href = url.toString();
      });
    })();
  </script>
</body>
</html>
